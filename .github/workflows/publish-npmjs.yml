name: Publish to npmjs

# 把 @bangbang-03/dsh-memory 发到 npmjs.com（公共源）。
#
# 两条发布线的分工：
#   GitHub Packages（publish.yml）—— lab 实验线 + v* 稳定线的 tarball / Release 资产；
#   npmjs（本文件）     —— 只发 v* 稳定线，给「dsh plugin add @bangbang-03/dsh-memory」
#                          这种标准安装方式用，也让市场目录能读到 npm 版本与下载量。
#
# 一次性准备（仓库管理员）：
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: NPM_TOKEN   Secret: npmjs.com 的 Automation token（Read and write）
#   或：gh secret set NPM_TOKEN --repo BangBang-03/dsh-memory
#
# 没配 NPM_TOKEN 时本工作流会**明确警告并跳过发布**（不会红），
# 测试与版本检查照跑，配好之后下一次打 v* 标签即自动发布。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-npmjs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # store 套件的 slugify 断言按 Windows 路径语义写，统一用 windows runner。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: 纯逻辑层测试
        shell: bash
        run: |
          node test/store.test.mjs
          node test/portrait.test.mjs
          node test/markdown.test.mjs
          node test/distill.test.mjs
          node test/api.test.mjs

      - name: NPM_TOKEN 是否配置
        id: guard
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::仓库没有配置 NPM_TOKEN，跳过 npmjs 发布（GitHub Packages 线不受影响）"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 版本还没发过
        if: steps.guard.outputs.has_token == 'true'
        shell: bash
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "::error::$name@$ver 已经在 npmjs 上，先改版本号再发"
            exit 1
          fi
          echo "$name@$ver 尚未发布，继续"

      - name: Publish
        if: steps.guard.outputs.has_token == 'true'
        shell: bash
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
