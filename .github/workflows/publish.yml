# 单线发布：main 是唯一长期分支，正式版用 v* 标签。
#
#   main push   只跑纯逻辑层测试，不发布；
#   v* tag      跑测试 + 校验版本 + 发 GitHub Packages `latest` + 建正式 Release。
#
# 发布统一在 Actions 里用 GITHUB_TOKEN；本机 PAT 没有 write:packages（403 实测）。
# 资产名固定：releases/latest/download/dsh-memory-latest.tgz
# 只改文档可以写 [skip ci] 跳过编译与发布。

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # main 上的日常提交只验证，不发版。
    if: github.ref == 'refs/heads/main'
    # windows：store 套件里的 slugify 按 Windows 路径语义断言（插件只跑在 DSH 桌面端），
    # 换成 ubuntu 会有两条失败。步骤本身用 bash，跨平台写法不用改。
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # host / activate / client / install 四个套件要 DSH 运行时包（本机靠 junction
      # 垫片解析），runner 上没有；CI 只跑纯逻辑层，其余套件发版前在本地跑。
      - name: 纯逻辑层测试
        run: |
          node test/store.test.mjs
          node test/portrait.test.mjs
          node test/markdown.test.mjs
          node test/distill.test.mjs
          node test/api.test.mjs

      - name: 兼容口径（README / package.json）
        run: node tools/check-compat.mjs

  stable:
    # 正式版：main 上打 v* 标签才发。
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: 纯逻辑层测试
        run: |
          node test/store.test.mjs
          node test/portrait.test.mjs
          node test/markdown.test.mjs
          node test/distill.test.mjs
          node test/api.test.mjs

      - name: 兼容口径（README / package.json）
        run: node tools/check-compat.mjs

      - name: 标签与 package.json 版本一致
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 的 $version 不一致"
            exit 1
          fi
          echo "标签与版本一致：$GITHUB_REF_NAME"

      - name: 发布到 GitHub Packages（dist-tag latest）
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 打包 Release 资产
        id: pack
        run: |
          file=$(npm pack --ignore-scripts 2>/dev/null | tail -n1)
          test -f "$file"
          cp "$file" dsh-memory-latest.tgz
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -l *.tgz

      - name: 建 / 更新正式 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes-stable.md <<'NOTES'
          **Memory Portrait** 稳定版。装上它（不需要凭据）：

          ```powershell
          pwsh -File install.ps1 -FromRelease -Channel stable
          ```

          也可以直接用一条命令：

          ```powershell
          dsh plugin --profile web add "https://github.com/BangBang-03/dsh-memory-portrait/releases/latest/download/dsh-memory-latest.tgz"
          ```
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
              --title "$GITHUB_REF_NAME · Memory Portrait" \
              --notes-file notes-stable.md
          fi
          gh release upload "$GITHUB_REF_NAME" "dsh-memory-latest.tgz" "${{ steps.pack.outputs.file }}" --clobber
