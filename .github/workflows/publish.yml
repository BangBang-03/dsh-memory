name: Publish npm package

# 发 @bangbang-03/dsh-memory 到 GitHub Packages。
# 本机 PAT 没有 write:packages（403 实测），而 Actions 的 GITHUB_TOKEN 对本仓库
# 天然有 packages:write，所以发布走这里：推 v* 标签自动发，或手动 dispatch。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # 纯逻辑层测试在 runner 上可跑；host/activate/client/install 需要 DSH 运行时包
    #（@deepseek-ai/* 只存在于本机 profile 的 node_modules，靠 junction 垫片解析），
    # 那四个套件在本地发版前跑，这里不重复。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: 纯逻辑层测试
        run: |
          node test/store.test.mjs
          node test/portrait.test.mjs
          node test/markdown.test.mjs
          node test/distill.test.mjs
          node test/api.test.mjs

      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
